<div class="rounded-xl border border-slate-200 bg-white shadow-sm overflow-hidden">
  <div class="flex items-center justify-between px-5 py-3 border-b border-slate-100 bg-slate-50/60">
    <h2 class="text-sm font-bold text-slate-800">Quality</h2>
    @if (canEdit) {
      <div class="flex items-center gap-2">
        <button type="button" (click)="addRow()" class="inline-flex h-8 items-center gap-1.5 rounded-lg border border-slate-200 px-3 text-[10px] font-bold uppercase text-slate-600 hover:bg-slate-100">
          <i class="pi pi-plus text-[10px]"></i>Add Row
        </button>
        <button type="button" (click)="saveAll()" [disabled]="saving()" class="inline-flex h-8 items-center gap-1.5 rounded-lg bg-blue-600 px-4 text-[10px] font-bold uppercase text-white hover:bg-blue-500 disabled:opacity-50">
          @if (saving()) { <i class="pi pi-spin pi-spinner text-[10px]"></i> }
          Save All
        </button>
      </div>
    }
  </div>

  <div class="overflow-x-auto">
    <table class="w-full text-xs" [formGroup]="form">
      <thead>
        <tr class="border-b border-slate-100 bg-white">
          <th class="px-3 py-2.5 text-left text-[9px] font-black uppercase tracking-wider text-slate-400 min-w-[70px]">SN</th>
          <th class="px-3 py-2.5 text-left text-[9px] font-black uppercase tracking-wider text-slate-400 min-w-[120px]">Phase</th>
          <th class="px-3 py-2.5 text-left text-[9px] font-black uppercase tracking-wider text-slate-400 min-w-[140px]">Date</th>
          <th class="px-3 py-2.5 text-left text-[9px] font-black uppercase tracking-wider text-slate-400 min-w-[220px]">Remarks</th>
          <th class="px-3 py-2.5 text-center text-[9px] font-black uppercase tracking-wider text-slate-400 min-w-[100px]">Reports</th>
          <th class="px-3 py-2.5 text-center text-[9px] font-black uppercase tracking-wider text-slate-400 min-w-[80px]">Action</th>
        </tr>
      </thead>
      <tbody formArrayName="rows">
        @for (row of rows.controls; track $index; let i = $index) {
          <tr [formGroupName]="i" class="border-b border-slate-50 last:border-0">
            <td class="px-3 py-2 text-slate-700 font-semibold">{{ asGroup(row).get('sn')?.value }}</td>
            <td class="px-3 py-2"><p-select [options]="phaseOptions" formControlName="phase" optionLabel="label" optionValue="value" [disabled]="!canEdit" styleClass="w-full" appendTo="body"></p-select></td>
            <td class="px-3 py-2"><p-datepicker formControlName="date" [disabled]="!canEdit" appendTo="body" dateFormat="dd/mm/yy" styleClass="w-full"></p-datepicker></td>
            <td class="px-3 py-2"><input pInputText formControlName="remarks" [disabled]="!canEdit" class="w-full text-xs" placeholder="Remarks" /></td>
            <td class="px-3 py-2 text-center">
              <button type="button" (click)="openRowEditModal(i)" [disabled]="!canEdit"
                class="inline-flex h-8 w-8 items-center justify-center rounded-lg border border-slate-200 text-slate-500 hover:text-blue-600 disabled:opacity-40">
                <i class="pi pi-pencil text-[10px]"></i>
              </button>
            </td>
            <td class="px-3 py-2 text-center">
              <button type="button" (click)="removeRow(i)" [disabled]="!canEdit || rows.length <= 1"
                class="inline-flex h-8 w-8 items-center justify-center rounded-lg border border-red-100 bg-red-50 text-red-500 hover:bg-red-100 disabled:opacity-40">
                <i class="pi pi-trash text-[10px]"></i>
              </button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>

@if (editingRowIndex() !== null) {
  <app-lp-quality-row-edit-modal
    [row]="asGroup(rows.at(editingRowIndex()!))"
    [rowIndex]="editingRowIndex()!"
    (close)="closeRowEditModal()"
    (fileSelected)="onRowFileSelected($event.index, $event.kind, $event.file)">
  </app-lp-quality-row-edit-modal>
}
