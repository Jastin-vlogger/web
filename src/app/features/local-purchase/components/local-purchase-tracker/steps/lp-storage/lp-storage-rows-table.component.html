<div class="overflow-x-auto">
  <table class="w-full text-xs" [formGroup]="asGroup(rows.parent)">
    <thead>
      <tr class="border-b border-slate-100 bg-white">
        <th class="px-3 py-2.5 text-left text-[9px] font-black uppercase tracking-wider text-slate-400 min-w-[140px]">Container/Serial No</th>
        <th class="px-3 py-2.5 text-left text-[9px] font-black uppercase tracking-wider text-slate-400 min-w-[90px]">Bags</th>
        <th class="px-3 py-2.5 text-left text-[9px] font-black uppercase tracking-wider text-slate-400 min-w-[140px]">Warehouse</th>
        <th class="px-3 py-2.5 text-left text-[9px] font-black uppercase tracking-wider text-slate-400 min-w-[120px]">Block</th>
        <th class="px-3 py-2.5 text-left text-[9px] font-black uppercase tracking-wider text-slate-400 min-w-[150px]">Received On</th>
        <th class="px-3 py-2.5 text-left text-[9px] font-black uppercase tracking-wider text-slate-400 min-w-[90px]">Shortage</th>
        <th class="px-3 py-2.5 text-center text-[9px] font-black uppercase tracking-wider text-slate-400 min-w-[100px]">Doc/GRN/Batch</th>
        <th class="px-3 py-2.5 text-center text-[9px] font-black uppercase tracking-wider text-slate-400 min-w-[80px]">Action</th>
      </tr>
    </thead>
    <tbody formArrayName="rows">
      @for (row of rows.controls; track $index; let i = $index) {
        <tr [formGroupName]="i" class="border-b border-slate-50 last:border-0">
          <td class="px-3 py-2"><input pInputText formControlName="containerSerialNo" [disabled]="!canEdit" class="w-full text-xs" placeholder="Serial no" /></td>
          <td class="px-3 py-2"><p-inputNumber formControlName="bags" [disabled]="!canEdit" styleClass="w-full" inputStyleClass="w-full text-xs"></p-inputNumber></td>
          <td class="px-3 py-2">
            <p-select formControlName="warehouse" [options]="warehouseOptions" optionLabel="label" optionValue="value"
              [disabled]="!canEdit" placeholder="Warehouse" styleClass="w-full" appendTo="body">
            </p-select>
          </td>
          <td class="px-3 py-2"><input pInputText formControlName="block" [disabled]="!canEdit" class="w-full text-xs" placeholder="Block" /></td>
          <td class="px-3 py-2"><p-datepicker formControlName="receivedOnDate" [disabled]="!canEdit" appendTo="body" dateFormat="dd/mm/yy" styleClass="w-full" inputStyleClass="w-full text-xs"></p-datepicker></td>
          <td class="px-3 py-2"><p-inputNumber formControlName="shortageBags" [disabled]="!canEdit" styleClass="w-full" inputStyleClass="w-full text-xs"></p-inputNumber></td>
          <td class="px-3 py-2 text-center">
            <button type="button" (click)="editRow.emit(i)" [disabled]="!canEdit"
              class="inline-flex h-8 w-8 items-center justify-center rounded-lg border border-slate-200 text-slate-500 hover:text-blue-600 disabled:opacity-40">
              <i class="pi pi-pencil text-[10px]"></i>
            </button>
          </td>
          <td class="px-3 py-2 text-center">
            <button type="button" (click)="removeRowIndex.emit(i)" [disabled]="!canEdit || rows.length <= 1"
              class="inline-flex h-8 w-8 items-center justify-center rounded-lg border border-red-100 bg-red-50 text-red-500 hover:bg-red-100 disabled:opacity-40">
              <i class="pi pi-trash text-[10px]"></i>
            </button>
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
