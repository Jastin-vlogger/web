@if (isOpen()) {
  <div class="fixed inset-0 z-[90] bg-slate-900/70 p-4 sm:p-8">
    <div class="mx-auto flex h-full w-full max-w-5xl flex-col overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-2xl">
      <div class="flex items-center justify-between border-b border-slate-200 px-4 py-3 sm:px-5">
        <h3 class="text-base font-bold text-slate-900 truncate">{{ title() }}</h3>
        <div class="flex items-center gap-2 shrink-0">
          <button type="button" (click)="zoomOut()" class="inline-flex h-9 w-9 items-center justify-center rounded-lg border border-slate-200 bg-white text-slate-500 hover:text-blue-600" title="Zoom out">
            <i class="pi pi-minus"></i>
          </button>
          <button type="button" (click)="zoomIn()" class="inline-flex h-9 w-9 items-center justify-center rounded-lg border border-slate-200 bg-white text-slate-500 hover:text-blue-600" title="Zoom in">
            <i class="pi pi-plus"></i>
          </button>
          <button type="button" (click)="resetZoom()" class="inline-flex rounded-lg border border-slate-200 bg-white px-3 py-2 text-[10px] font-bold uppercase tracking-wider text-slate-500 hover:text-blue-600">
            Reset
          </button>
          <button type="button" (click)="close()" title="Close preview"
            class="h-9 w-9 rounded-full border border-slate-200 text-slate-500 hover:border-rose-200 hover:text-rose-500">
            <i class="pi pi-times"></i>
          </button>
        </div>
      </div>
      <div class="min-h-0 flex-1 overflow-auto bg-slate-100 p-3 sm:p-4">
        @if (isImage()) {
          <div class="flex h-full w-full items-center justify-center overflow-auto rounded-xl border-2 border-dashed border-blue-100 bg-white/70 p-2">
            <img
              [src]="url() || ''"
              alt="Document preview"
              class="max-h-full max-w-full rounded-xl object-contain transition-transform duration-200 cursor-zoom-in"
              [style.transform]="'scale(' + zoom() + ')'"
              [style.transformOrigin]="transformOrigin()"
              (dblclick)="onImageDoubleClick($event)" />
          </div>
        } @else {
          <iframe [src]="safeUrl()" class="h-full w-full rounded-xl bg-white" title="Document preview"></iframe>
        }
      </div>
    </div>
  </div>
}
